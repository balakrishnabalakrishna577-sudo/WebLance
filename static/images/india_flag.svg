<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Flag of India">
  <!-- Saffron stripe -->
  <rect width="900" height="200" fill="#FF9933"/>
  <!-- White stripe -->
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>
  <!-- Green stripe -->
  <rect y="400" width="900" height="200" fill="#138808"/>

  <!-- Ashoka Chakra — navy blue, 24 spokes, centred on white stripe -->
  <g transform="translate(450,300)">
    <!-- Outer ring -->
    <circle r="86" fill="none" stroke="#003087" stroke-width="9"/>
    <!-- Inner hub -->
    <circle r="13" fill="#003087"/>
    <!-- 24 spokes at 15° intervals -->
    <g stroke="#003087" stroke-width="4.5">
      <line y1="-73" y2="-17"/>
      <line y1="-73" y2="-17" transform="rotate(15)"/>
      <line y1="-73" y2="-17" transform="rotate(30)"/>
      <line y1="-73" y2="-17" transform="rotate(45)"/>
      <line y1="-73" y2="-17" transform="rotate(60)"/>
      <line y1="-73" y2="-17" transform="rotate(75)"/>
      <line y1="-73" y2="-17" transform="rotate(90)"/>
      <line y1="-73" y2="-17" transform="rotate(105)"/>
      <line y1="-73" y2="-17" transform="rotate(120)"/>
      <line y1="-73" y2="-17" transform="rotate(135)"/>
      <line y1="-73" y2="-17" transform="rotate(150)"/>
      <line y1="-73" y2="-17" transform="rotate(165)"/>
      <line y1="-73" y2="-17" transform="rotate(180)"/>
      <line y1="-73" y2="-17" transform="rotate(195)"/>
      <line y1="-73" y2="-17" transform="rotate(210)"/>
      <line y1="-73" y2="-17" transform="rotate(225)"/>
      <line y1="-73" y2="-17" transform="rotate(240)"/>
      <line y1="-73" y2="-17" transform="rotate(255)"/>
      <line y1="-73" y2="-17" transform="rotate(270)"/>
      <line y1="-73" y2="-17" transform="rotate(285)"/>
      <line y1="-73" y2="-17" transform="rotate(300)"/>
      <line y1="-73" y2="-17" transform="rotate(315)"/>
      <line y1="-73" y2="-17" transform="rotate(330)"/>
      <line y1="-73" y2="-17" transform="rotate(345)"/>
    </g>
    <!-- Small dot at each spoke tip (authentic detail) -->
    <g fill="#003087">
      <circle cy="-78" r="5"/>
      <circle cy="-78" r="5" transform="rotate(15)"/>
      <circle cy="-78" r="5" transform="rotate(30)"/>
      <circle cy="-78" r="5" transform="rotate(45)"/>
      <circle cy="-78" r="5" transform="rotate(60)"/>
      <circle cy="-78" r="5" transform="rotate(75)"/>
      <circle cy="-78" r="5" transform="rotate(90)"/>
      <circle cy="-78" r="5" transform="rotate(105)"/>
      <circle cy="-78" r="5" transform="rotate(120)"/>
      <circle cy="-78" r="5" transform="rotate(135)"/>
      <circle cy="-78" r="5" transform="rotate(150)"/>
      <circle cy="-78" r="5" transform="rotate(165)"/>
      <circle cy="-78" r="5" transform="rotate(180)"/>
      <circle cy="-78" r="5" transform="rotate(195)"/>
      <circle cy="-78" r="5" transform="rotate(210)"/>
      <circle cy="-78" r="5" transform="rotate(225)"/>
      <circle cy="-78" r="5" transform="rotate(240)"/>
      <circle cy="-78" r="5" transform="rotate(255)"/>
      <circle cy="-78" r="5" transform="rotate(270)"/>
      <circle cy="-78" r="5" transform="rotate(285)"/>
      <circle cy="-78" r="5" transform="rotate(300)"/>
      <circle cy="-78" r="5" transform="rotate(315)"/>
      <circle cy="-78" r="5" transform="rotate(330)"/>
      <circle cy="-78" r="5" transform="rotate(345)"/>
    </g>
  </g>
</svg>
