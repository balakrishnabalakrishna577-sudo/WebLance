<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle network dots -->
  <circle cx="80"  cy="80"  r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="432" cy="80"  r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="80"  cy="432" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="432" cy="432" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="256" cy="60"  r="4" fill="rgba(255,255,255,0.12)"/>
  <circle cx="60"  cy="256" r="4" fill="rgba(255,255,255,0.12)"/>
  <circle cx="452" cy="256" r="4" fill="rgba(255,255,255,0.12)"/>
  <circle cx="256" cy="452" r="4" fill="rgba(255,255,255,0.12)"/>

  <!-- Subtle network lines -->
  <line x1="80"  y1="80"  x2="256" y2="60"  stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="432" y1="80"  x2="256" y2="60"  stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="80"  y1="432" x2="60"  y2="256" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="432" y1="432" x2="452" y2="256" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Bold W letterform -->
  <path d="
    M 88 148
    L 148 364
    L 208 220
    L 256 320
    L 304 220
    L 364 364
    L 424 148
    L 380 148
    L 336 300
    L 288 200
    L 256 280
    L 224 200
    L 176 300
    L 132 148
    Z
  " fill="url(#wGrad)" />

  <!-- Bottom accent bar -->
  <rect x="88" y="370" width="336" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>
