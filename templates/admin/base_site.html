{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Weblance Admin{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
<link rel="shortcut icon" href="{% static 'images/fav-icon.png' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/fav-icon.png' %}">
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    #header {
        background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%) !important;
        box-shadow: 0 2px 12px rgba(99,102,241,0.3);
    }
    #header a:link, #header a:visited { color: #fff !important; }
    #branding h1 a:link, #branding h1 a:visited { color: #fff !important; }
    .module h2, .module caption, .inline-group h2 {
        background: linear-gradient(135deg, #6366F1, #4F46E5) !important;
    }
    .button, input[type=submit], input[type=button],
    .submit-row input, a.button {
        background: #6366F1 !important;
        border-color: #4F46E5 !important;
    }
    .button:hover, input[type=submit]:hover { background: #4F46E5 !important; }
    a:focus, .button:focus { outline-color: #6366F1 !important; }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name" style="display:flex;align-items:center;gap:10px;margin:0;">
    <img src="{% static 'images/favicon.svg' %}" alt="W" width="28" height="28"
         style="border-radius:6px;vertical-align:middle;flex-shrink:0;">
    <a href="{% url 'admin:index' %}" style="color:#fff;text-decoration:none;font-weight:700;
       font-size:1rem;letter-spacing:1px;font-family:sans-serif;">
        WEBLANCE Admin
    </a>
</h1>
{% endblock %}
