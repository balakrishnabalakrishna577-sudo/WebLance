{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Complete — WEBLANCE{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card" style="text-align:center;">
        <div style="width:72px;height:72px;background:rgba(99,102,241,0.1);border-radius:50%;
                    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
                    box-shadow:0 8px 30px rgba(99,102,241,0.2);">
            <i class="fas fa-check-circle" style="color:#6366F1;font-size:1.8rem;"></i>
        </div>
        <h2 style="color:#fff;font-weight:800;margin-bottom:8px;">Password Reset!</h2>
        <p style="color:var(--text-gray);font-size:0.9rem;line-height:1.7;margin-bottom:28px;">
            Your password has been successfully reset.<br>
            You can now sign in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn-auth" style="display:block;text-decoration:none;">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In Now
        </a>
    </div>
</section>
{% endblock %}
