{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password — WEBLANCE{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-mark" style="background:rgba(255,165,0,0.15);box-shadow:0 8px 30px rgba(255,165,0,0.3);">
                <i class="fas fa-key" style="color:#ffa500;"></i>
            </div>
            <h2>WEB<span class="text-green">LANCE</span></h2>
            <p>Reset your password</p>
        </div>

        <p style="color:var(--text-gray);font-size:0.88rem;margin-bottom:24px;text-align:center;line-height:1.6;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="auth-input-group">
                <label for="id_email">Email Address</label>
                <input type="email" id="id_email" name="email"
                       placeholder="Enter your email address"
                       autocomplete="email" required>
                <i class="fas fa-envelope input-icon"></i>
            </div>
            <button type="submit" class="btn-auth" style="background:linear-gradient(135deg,#ffa500,#e67e00);">
                <i class="fas fa-paper-plane me-2"></i> Send Reset Link
            </button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'login' %}"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
        </div>
    </div>
</section>
{% endblock %}
